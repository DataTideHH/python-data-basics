[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-data-basics"
version = "0.2.0"
description = "A compact, tested Python 3.12 foundation for reproducible Data and BI workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Tobias Wietelmann" },
]
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
]

[project.scripts]
python-data-quality = "data_quality.__main__:main"

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1,<2",
]
ml = [
    "scikit-learn>=1.4,<2",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools]
py-modules = ["main"]
packages = ["data_quality"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".ci-output", "output"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
docstring-code-format = true
